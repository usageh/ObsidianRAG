<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识图谱 - Obsidian RAG</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      margin: 0; background: #f5f5f7; color: #1d1d1f; }
    .nav { background: #fff; border-bottom: 1px solid #e3e3e8; padding: 10px 20px; }
    .nav a { color: #0071e3; text-decoration: none; margin-right: 16px; font-size: 14px; }
    .nav a.cur { color: #1d1d1f; font-weight: 600; }
    #network { width: 100%; height: calc(100vh - 48px); background: #fff; }
    .hint { position: fixed; bottom: 16px; left: 16px; background: #fff; padding: 8px 12px;
      border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); font-size: 12px; color: #6e6e73; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">问答</a>
    <a href="/review.html">抽问复习</a>
    <a href="/quiz.html">主动测验</a>
    <a href="/graph.html" class="cur">知识图谱</a>
  </div>
  <div id="network"></div>
  <div class="hint">拖拽节点 / 滚轮缩放 / 点击节点跳转问答。同色 = 同主题。</div>
  <script>
    fetch('/api/graph').then(function (r) { return r.json(); }).then(function (data) {
      const nodes = new vis.DataSet((data.nodes || []).map(function (n) {
        return {
          id: n.id,
          label: n.label,
          group: n.group,
          title: (n.topic ? '主题: ' + n.topic + '\n' : '') + n.path,
          path: n.path,
        };
      }));
      const edges = new vis.DataSet((data.edges || []).map(function (e, i) {
        return { id: i, from: e.from, to: e.to, color: e.type === 'link' ? { color: '#cfcfcf' } : { color: '#ffd2a0', dashes: true } };
      }));
      const options = {
        nodes: { shape: 'dot', size: 14, font: { size: 13 } },
        edges: { smooth: { type: 'continuous' }, width: 1 },
        groups: {
          unsorted: { color: { background: '#bdbdbd', border: '#8a8a8a' } },
        },
        physics: { stabilization: { iterations: 200 }, barnesHut: { gravitationalConstant: -3000 } },
        interaction: { hover: true, tooltipDelay: 120, navigationButtons: false, keyboard: false },
      };
      const net = new vis.Network(document.getElementById('network'), { nodes: nodes, edges: edges }, options);
      net.on('click', function (params) {
        if (params.nodes.length > 0) {
          const node = nodes.get(params.nodes[0]);
          if (node && node.label) {
            window.location.href = '/?q=' + encodeURIComponent(node.label);
          }
        }
      });
    }).catch(function (e) {
      document.getElementById('network').textContent = '加载失败: ' + e;
    });
  </script>
</body>
</html>
