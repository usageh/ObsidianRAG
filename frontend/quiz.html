<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主动测验 - Obsidian RAG</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      margin: 0; background: #f5f5f7; color: #1d1d1f; line-height: 1.6; }
    .nav { background: #fff; border-bottom: 1px solid #e3e3e8; padding: 10px 20px; }
    .nav a { color: #0071e3; text-decoration: none; margin-right: 16px; font-size: 14px; }
    .nav a.cur { color: #1d1d1f; font-weight: 600; }
    .container { max-width: 760px; margin: 0 auto; padding: 24px 20px 64px; }
    .panel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 20px; }
    .panel h2 { font-size: 16px; margin: 0 0 12px; }
    .topic-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f2f2f4; }
    .topic-item:last-child { border-bottom: none; }
    .topic-label { font-weight: 500; }
    .topic-mastery { color: #86868b; font-size: 13px; }
    .mastery-bar { width: 80px; height: 6px; background: #e3e3e8; border-radius: 3px; overflow: hidden; margin-left: 12px; }
    .mastery-fill { height: 100%; background: #d93025; }
    .quiz-q { font-size: 18px; font-weight: 500; margin-bottom: 16px; }
    .ref { color: #1d1d1f; font-size: 15px; white-space: pre-wrap; padding: 16px; background: #f0f5ff; border-radius: 8px; }
    .rates { display: flex; gap: 10px; margin-top: 20px; }
    .rates button { flex: 1; }
    .r-again { background: #d93025; } .r-hard { background: #f9ab00; } .r-good { background: #1e8e3e; } .r-easy { background: #0071e3; }
    .status { color: #6e6e73; font-size: 13px; min-height: 18px; margin: 10px 0; }
    .empty { text-align: center; color: #6e6e73; padding: 40px 0; }
    .hidden { display: none; }
    button { border: none; background: #0071e3; color: #fff; font-size: 14px; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #a0c4ec; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">问答</a>
    <a href="/review.html">抽问复习</a>
    <a href="/quiz.html" class="cur">主动测验</a>
    <a href="/graph.html">知识图谱</a>
  </div>
  <div class="container">
    <div class="panel">
      <h2>薄弱主题</h2>
      <div id="topics"></div>
      <div id="topics-empty" class="empty hidden">暂无薄弱主题(去复习几张卡片再来)。</div>
    </div>

    <div class="panel hidden" id="quiz-panel">
      <div class="status" id="quiz-status"></div>
      <div class="quiz-q" id="quiz-question"></div>
      <button id="reveal-btn">显示参考答案</button>
      <div id="quiz-ref" class="ref hidden"></div>
      <div id="rates" class="rates hidden">
        <button class="r-again" data-r="1">答得差</button>
        <button class="r-hard" data-r="2">一般</button>
        <button class="r-good" data-r="3">较好</button>
        <button class="r-easy" data-r="4">很好</button>
      </div>
      <div class="status" id="result-status"></div>
    </div>
  </div>
  <script>
    const $topics = document.getElementById('topics');
    const $topicsEmpty = document.getElementById('topics-empty');
    const $quizPanel = document.getElementById('quiz-panel');
    const $qStatus = document.getElementById('quiz-status');
    const $qQ = document.getElementById('quiz-question');
    const $qRef = document.getElementById('quiz-ref');
    const $reveal = document.getElementById('reveal-btn');
    const $rates = document.getElementById('rates');
    const $result = document.getElementById('result-status');
    let currentQuiz = null;

    async function loadWeak() {
      const r = await fetch('/api/quiz/weak');
      const d = await r.json();
      const topics = d.topics || [];
      $topics.innerHTML = '';
      if (topics.length === 0) {
        $topicsEmpty.classList.remove('hidden');
        return;
      }
      $topicsEmpty.classList.add('hidden');
      topics.forEach(function (t) {
        const row = document.createElement('div');
        row.className = 'topic-item';
        const left = document.createElement('div');
        left.style.display = 'flex';
        left.style.alignItems = 'center';
        const lab = document.createElement('span');
        lab.className = 'topic-label';
        lab.textContent = t.label;
        const bar = document.createElement('div');
        bar.className = 'mastery-bar';
        const fill = document.createElement('div');
        fill.className = 'mastery-fill';
        fill.style.width = Math.round(t.mastery * 100) + '%';
        bar.appendChild(fill);
        left.appendChild(lab);
        left.appendChild(bar);
        const m = document.createElement('span');
        m.className = 'topic-mastery';
        m.textContent = '掌握度 ' + Math.round(t.mastery * 100) + '%';
        const btn = document.createElement('button');
        btn.textContent = '出题';
        btn.addEventListener('click', function () { generateQuiz(t.topic_id, t.label); });
        row.appendChild(left);
        row.appendChild(btn);
        $topics.appendChild(row);
      });
    }

    async function generateQuiz(topicId, label) {
      $quizPanel.classList.remove('hidden');
      $qStatus.textContent = '正在出题(' + label + ')...';
      $qQ.textContent = '';
      $qRef.classList.add('hidden');
      $rates.classList.add('hidden');
      $reveal.classList.add('hidden');
      $result.textContent = '';
      try {
        const r = await fetch('/api/quiz/generate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic_id: topicId }),
        });
        const d = await r.json();
        if (d.error) { $qStatus.textContent = '无法出题: ' + d.error; return; }
        currentQuiz = d;
        $qStatus.textContent = '主题: ' + d.topic;
        $qQ.textContent = d.question;
        $reveal.classList.remove('hidden');
      } catch (e) { $qStatus.textContent = '出错: ' + e.message; }
    }

    $reveal.addEventListener('click', function () {
      $reveal.classList.add('hidden');
      $qRef.textContent = currentQuiz.reference_answer || '';
      $qRef.classList.remove('hidden');
      $rates.classList.remove('hidden');
    });

    $rates.addEventListener('click', async function (e) {
      const b = e.target.closest('button');
      if (!b || !currentQuiz) return;
      const rating = parseInt(b.dataset.r, 10);
      const r = await fetch('/api/quiz/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          topic_id: currentQuiz.topic_id,
          question: currentQuiz.question,
          reference_answer: currentQuiz.reference_answer,
          rating: rating,
        }),
      });
      const d = await r.json();
      const m = d.topic_mastery;
      $result.textContent = '已更新掌握度: ' + (m != null ? Math.round(m * 100) + '%' : '无');
      $rates.classList.add('hidden');
      setTimeout(loadWeak, 800);
    });

    loadWeak();
  </script>
</body>
</html>
